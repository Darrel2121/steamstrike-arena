<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="gearGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="60%" stop-color="#c59b27"/>
      <stop offset="100%" stop-color="#703816"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fff2b2"/>
      <stop offset="80%" stop-color="#ff9f1c"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0b0d11"/>
  <rect width="60" height="60" x="2" y="2" rx="12" fill="none" stroke="#c59b27" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Steampunk Gear Outer Ring -->
  <g transform="translate(32,32)" filter="url(#glow)">
    <!-- 8 Gear Teeth -->
    <path d="M-5,-24 L5,-24 L4,-18 L-4,-18 Z" fill="#c59b27"/>
    <path d="M-5,-24 L5,-24 L4,-18 L-4,-18 Z" fill="#c59b27" transform="rotate(45)"/>
    <path d="M-5,-24 L5,-24 L4,-18 L-4,-18 Z" fill="#c59b27" transform="rotate(90)"/>
    <path d="M-5,-24 L5,-24 L4,-18 L-4,-18 Z" fill="#c59b27" transform="rotate(135)"/>
    <path d="M-5,-24 L5,-24 L4,-18 L-4,-18 Z" fill="#c59b27" transform="rotate(180)"/>
    <path d="M-5,-24 L5,-24 L4,-18 L-4,-18 Z" fill="#c59b27" transform="rotate(225)"/>
    <path d="M-5,-24 L5,-24 L4,-18 L-4,-18 Z" fill="#c59b27" transform="rotate(270)"/>
    <path d="M-5,-24 L5,-24 L4,-18 L-4,-18 Z" fill="#c59b27" transform="rotate(315)"/>
    <!-- Main Gear Wheel -->
    <circle r="18" fill="url(#gearGrad)" stroke="#1a0f05" stroke-width="1.5"/>
    <circle r="12" fill="#12161f" stroke="#c59b27" stroke-width="1.2"/>
    <!-- Steam Lantern Core Beacon -->
    <circle r="9" fill="url(#coreGlow)"/>
    <circle r="4" fill="#ffffff"/>
  </g>
</svg>
